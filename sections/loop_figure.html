<figure class="loop-diagram" aria-label="train.py 主训练循环流程图">
      <p class="loop-title">train.py · while True 主循环</p>
      <svg viewBox="0 0 520 780" role="img" aria-labelledby="loop-svg-title loop-svg-desc">
        <title id="loop-svg-title">train.py while True 训练循环</title>
        <desc id="loop-svg-desc">从设学习率开始，可选评估存盘，再做前向反向更新，打日志后判断是否结束或回到开头。</desc>
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6a7a"/>
          </marker>
          <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
          </marker>
        </defs>

        <!-- 启动（循环外） -->
        <rect x="140" y="8" width="240" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="260" y="28" text-anchor="middle" font-size="12" fill="#64748b" font-family="IBM Plex Mono, monospace">循环外 · 只做一次</text>
        <text x="260" y="44" text-anchor="middle" font-size="13" fill="#1a2332" font-family="Source Sans 3, sans-serif">配置 → 模型 → AdamW → 首个 batch</text>

        <line x1="260" y1="52" x2="260" y2="78" stroke="#5a6a7a" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- 入口锚点 while True -->
        <rect x="155" y="78" width="210" height="40" rx="8" fill="#0f766e"/>
        <text x="260" y="103" text-anchor="middle" font-size="15" fill="#fff" font-weight="600" font-family="IBM Plex Mono, monospace">while True</text>

        <line x1="260" y1="118" x2="260" y2="142" stroke="#5a6a7a" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- ① 设 lr -->
        <rect x="120" y="142" width="280" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
        <text x="260" y="164" text-anchor="middle" font-size="14" fill="#134e4a" font-weight="600" font-family="Source Sans 3, sans-serif">① 设学习率</text>
        <text x="260" y="182" text-anchor="middle" font-size="12" fill="#5a6a7a" font-family="IBM Plex Mono, monospace">lr = get_lr(iter_num)</text>

        <line x1="260" y1="194" x2="260" y2="218" stroke="#5a6a7a" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- ② 菱形：要不要评估 -->
        <polygon points="260,218 360,258 260,298 160,258" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.8"/>
        <text x="260" y="252" text-anchor="middle" font-size="13" fill="#0c4a6e" font-weight="600" font-family="Source Sans 3, sans-serif">② 到评估点？</text>
        <text x="260" y="268" text-anchor="middle" font-size="11" fill="#0369a1" font-family="IBM Plex Mono, monospace">% eval_interval == 0</text>

        <!-- 右分支：评估 -->
        <line x1="360" y1="258" x2="430" y2="258" stroke="#0369a1" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="392" y="250" text-anchor="middle" font-size="11" fill="#0369a1" font-family="Source Sans 3, sans-serif">是</text>
        <rect x="392" y="278" width="116" height="78" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
        <text x="450" y="300" text-anchor="middle" font-size="12" fill="#0c4a6e" font-weight="600" font-family="Source Sans 3, sans-serif">estimate_loss</text>
        <text x="450" y="318" text-anchor="middle" font-size="11" fill="#0369a1" font-family="Source Sans 3, sans-serif">记曲线点</text>
        <text x="450" y="336" text-anchor="middle" font-size="11" fill="#0369a1" font-family="Source Sans 3, sans-serif">可能存 ckpt</text>
        <path d="M450 356 L450 390 L300 390" fill="none" stroke="#0369a1" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

        <!-- 否 → 继续 -->
        <line x1="260" y1="298" x2="260" y2="330" stroke="#5a6a7a" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="248" y="318" text-anchor="end" font-size="11" fill="#5a6a7a" font-family="Source Sans 3, sans-serif">否</text>

        <!-- ③ 训练一步（核心盒子） -->
        <rect x="95" y="330" width="330" height="168" rx="12" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
        <text x="260" y="354" text-anchor="middle" font-size="14" fill="#9a3412" font-weight="600" font-family="Source Sans 3, sans-serif">③ 训练一步（每圈必做）</text>
        <!-- 子步骤 -->
        <rect x="115" y="368" width="290" height="28" rx="6" fill="#ffedd5"/>
        <text x="260" y="387" text-anchor="middle" font-size="12" fill="#7c2d12" font-family="IBM Plex Mono, monospace">model(X,Y) → loss</text>
        <line x1="260" y1="396" x2="260" y2="408" stroke="#b45309" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="115" y="408" width="290" height="28" rx="6" fill="#ffedd5"/>
        <text x="260" y="427" text-anchor="middle" font-size="12" fill="#7c2d12" font-family="IBM Plex Mono, monospace">backward() 写 .grad</text>
        <line x1="260" y1="436" x2="260" y2="448" stroke="#b45309" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="115" y="448" width="290" height="36" rx="6" fill="#ffedd5"/>
        <text x="260" y="464" text-anchor="middle" font-size="12" fill="#7c2d12" font-family="IBM Plex Mono, monospace">clip → AdamW.step</text>
        <text x="260" y="478" text-anchor="middle" font-size="11" fill="#b45309" font-family="IBM Plex Mono, monospace">→ zero_grad</text>

        <line x1="260" y1="498" x2="260" y2="522" stroke="#5a6a7a" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- ④ 日志 -->
        <rect x="120" y="522" width="280" height="52" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
        <text x="260" y="544" text-anchor="middle" font-size="14" fill="#134e4a" font-weight="600" font-family="Source Sans 3, sans-serif">④ 打日志 · 计数 +1</text>
        <text x="260" y="562" text-anchor="middle" font-size="12" fill="#5a6a7a" font-family="IBM Plex Mono, monospace">iter loss · iter_num += 1</text>

        <line x1="260" y1="574" x2="260" y2="598" stroke="#5a6a7a" stroke-width="1.6" marker-end="url(#arrow)"/>

        <!-- ⑤ 结束判断 -->
        <polygon points="260,598 365,638 260,678 155,638" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
        <text x="260" y="632" text-anchor="middle" font-size="13" fill="#334155" font-weight="600" font-family="Source Sans 3, sans-serif">⑤ 超过 max_iters？</text>
        <text x="260" y="650" text-anchor="middle" font-size="11" fill="#64748b" font-family="IBM Plex Mono, monospace">iter_num &gt; max_iters</text>

        <!-- 否：回到 while -->
        <path d="M155 638 L48 638 L48 98 L155 98" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
        <text x="36" y="370" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="600" font-family="Source Sans 3, sans-serif" transform="rotate(-90 36 370)">否 · 下一圈</text>

        <!-- 是：结束画图 -->
        <line x1="260" y1="678" x2="260" y2="708" stroke="#5a6a7a" stroke-width="1.6" marker-end="url(#arrow)"/>
        <text x="272" y="698" text-anchor="start" font-size="11" fill="#64748b" font-family="Source Sans 3, sans-serif">是 · break</text>
        <rect x="140" y="708" width="240" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
        <text x="260" y="730" text-anchor="middle" font-size="13" fill="#334155" font-weight="600" font-family="Source Sans 3, sans-serif">画 loss_curve.png</text>
        <text x="260" y="748" text-anchor="middle" font-size="12" fill="#64748b" font-family="IBM Plex Mono, monospace">训练结束</text>
      </svg>
      <ul class="loop-legend">
        <li><i class="lg-main" aria-hidden="true"></i>主路径（每圈）</li>
        <li><i class="lg-branch" aria-hidden="true"></i>评估旁路（定期）</li>
        <li><i class="lg-train" aria-hidden="true"></i>真正改权重</li>
        <li><i class="lg-end" aria-hidden="true"></i>结束 / 画图</li>
      </ul>
    </figure>
