<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>封面 · 大模型训练入门</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Outfit:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --ink: #141414;
      --muted: #4a4a4a;
      --orange: #f5a623;
      --orange-deep: #e8940f;
      --line: #f0e6d4;
      --red-spine: #e23b2e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #eceae6;
      font-family: "Noto Sans SC", system-ui, sans-serif;
      color: var(--ink);
    }
    .stage { width: min(420px, 100%); }
    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .actions a {
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
    }
    .actions a:hover { color: var(--orange-deep); }
    .cover {
      position: relative;
      aspect-ratio: 3 / 4.25;
      background: var(--bg);
      border-radius: 2px;
      box-shadow:
        0 1px 0 rgba(0,0,0,0.04),
        0 18px 50px rgba(20,20,20,0.14);
      overflow: hidden;
      padding: 1.15rem 1.25rem 1.1rem;
      display: flex;
      flex-direction: column;
    }
    .spine-mark {
      position: absolute;
      left: 0;
      top: 0.85rem;
      width: 0.42rem;
      height: 1.35rem;
      background: var(--red-spine);
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: start;
      padding-left: 0.35rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.18rem 0.65rem;
      border: 1.5px solid var(--orange);
      border-radius: 999px;
      color: var(--orange-deep);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.55rem;
    }
    .sell {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.25;
    }
    .sell .divider {
      width: 2px;
      align-self: stretch;
      background: var(--orange);
      border-radius: 2px;
    }
    .mark {
      font-family: "Outfit", sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      color: var(--ink);
      text-align: right;
      line-height: 1.2;
      padding-top: 0.15rem;
    }
    .mark span {
      display: block;
      color: var(--orange-deep);
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
    .title-block {
      margin-top: 1.35rem;
      text-align: center;
    }
    .title-lead {
      margin: 0;
      font-size: clamp(1.55rem, 6.2vw, 1.95rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      line-height: 1.15;
    }
    .title-brand {
      margin: 0.15rem 0 0;
      font-family: "Outfit", "Noto Sans SC", sans-serif;
      font-size: clamp(1.75rem, 7.2vw, 2.25rem);
      font-weight: 800;
      color: var(--orange);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .title-sub {
      margin: 0.85rem auto 0;
      max-width: 17rem;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.55;
      color: var(--ink);
    }
    .author {
      margin: 0.85rem 0 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--ink);
      line-height: 1.55;
      max-width: 20rem;
      margin-left: auto;
      margin-right: auto;
    }
    .title-sub .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
    }
    .tri {
      width: 0;
      height: 0;
      border-style: solid;
      flex: 0 0 auto;
    }
    .tri-l {
      border-width: 0.28rem 0 0.28rem 0.42rem;
      border-color: transparent transparent transparent var(--orange);
    }
    .tri-r {
      border-width: 0.28rem 0.42rem 0.28rem 0;
      border-color: transparent var(--orange) transparent transparent;
    }
    .art {
      flex: 1;
      display: grid;
      place-items: center;
      min-height: 0;
      margin: 0.4rem 0 0.2rem;
      padding: 0 0.4rem;
    }
    .art img {
      width: min(100%, 280px);
      height: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: multiply;
    }
    .bottom {
      display: grid;
      grid-template-columns: 1.35fr 0.9fr;
      gap: 0.75rem;
      align-items: end;
    }
    .features .tag {
      display: inline-block;
      background: var(--orange);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.28rem 0.55rem;
      border-radius: 0.45rem;
      margin-bottom: 0.55rem;
      line-height: 1.3;
    }
    .features ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
    }
    .features li {
      display: grid;
      grid-template-columns: 0.85rem 1fr;
      gap: 0.35rem;
      align-items: start;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink);
    }
    .features li::before {
      content: "➤";
      color: var(--orange);
      font-size: 0.68rem;
      line-height: 1.35;
    }
    .res {
      text-align: right;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.45;
      padding-bottom: 0.15rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
    }
    .res .icon {
      display: inline-grid;
      place-items: center;
      width: 1.55rem;
      height: 1.55rem;
      border: 1.5px solid var(--orange);
      border-radius: 0.35rem;
      color: var(--orange-deep);
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
    }
    .res strong {
      display: block;
      color: var(--ink);
      font-size: 0.74rem;
      margin-bottom: 0.1rem;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .actions { display: none; }
      .stage { width: 100%; max-width: none; }
      .cover { box-shadow: none; width: 148mm; height: 210mm; aspect-ratio: auto; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <article class="cover" aria-label="大模型训练入门 封面">
      <div class="spine-mark" aria-hidden="true"></div>
      <header class="top">
        <div>
          <div class="badge">大模型训练学习</div>
          <div class="sell">
            <div>5章体系化精讲</div>
            <div class="divider" aria-hidden="true"></div>
            <div>数据 · 结构 · 优化 · 循环</div>
          </div>
        </div>
        <div class="mark">LLM<span>TRAINING</span></div>
      </header>

      <div class="title-block">
        <p class="title-lead">从零读懂</p>
        <p class="title-brand">大模型训练入门</p>
        <div class="title-sub">
          <div>把黑盒训练链路</div>
          <div class="row">
            <span class="tri tri-l" aria-hidden="true"></span>
            <span>变成可核对的数学与代码</span>
            <span class="tri tri-r" aria-hidden="true"></span>
          </div>
        </div>
        <p class="author">陈雷 · 陈朝飞 · 黄桃 · 夏志强 · 著</p>
      </div>

      <div class="art">
        <img src="images/cover-hero.png" alt="大模型训练入门封面插画" />
      </div>

      <footer class="bottom">
        <div class="features">
          <div class="tag">基于 nanoGPT 的实践向入门</div>
          <ul>
            <li>下一个 token 与交叉熵</li>
            <li>Attention / MLP 白话拆解</li>
            <li>训练循环 · 采样 · 过拟合</li>
          </ul>
        </div>
        <div class="res">
          <div class="icon" aria-hidden="true">▣</div>
          <strong>配套学习资源</strong>
          HTML 章节笔记<br />
          小节导航 · 实战附录
        </div>
      </footer>
    </article>

    <div class="actions">
      <a href="index.html">进入目录 →</a>
      <a href="javascript:window.print()">打印 / 导出 PDF</a>
    </div>
  </div>
</body>
</html>
